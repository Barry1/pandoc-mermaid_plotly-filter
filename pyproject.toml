[project]
name = "pandoc-mermaid_plotly-filter"
version = "1.0.0"
description = "Pandoc filter: mermaid -> plotly PNG 1920x1080"
requires-python = ">=3.10"
dependencies = ["plotly>=5.0", "kaleido>=0.2"]

[project.scripts]
pandoc-mermaid_plotly = "pandoc_mermaid_plotly_filter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"